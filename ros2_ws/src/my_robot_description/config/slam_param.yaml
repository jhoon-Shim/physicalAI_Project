slam_toolbox:
  ros__parameters:
    # --- 기본 좌표계 및 토픽 설정 ---
    odom_frame: odom                    # 오도메트리 좌표계 프레임 (map → odom 변환 제공)
    map_frame: map                      # 맵 좌표계 프레임 (map → odom publish)
    base_frame: base_footprint          # 로봇 베이스 프레임 (센서, 바퀴의 기준 좌표계 / odom → base_footprint 변환)
    scan_topic: /scan                   # 구독할 LiDAR 스캔 토픽 이름 ( / )

    # --- SLAM 동작 모드 설정 ---
    mode: mapping                       # SLAM 모드: mapping (맵 생성 또는 위치 추정) / localization (위치 추정)

    # --- TF 및 지도 갱신 주기 설정 ---
    transform_publish_period: 0.02      # TF(map→odom) 발행 주기 초 (0.02초, 50Hz)
    resolution: 0.05                    # Occupancy Grid 맵 해상도 픽셀 (m/픽셀), 5cm

    # --- 맵 업데이트 트리거 조건 ---
    minimum_travel_distance: 0.05       # 맵 업데이트 최소 직진 이동 거리 (m)
    minimum_travel_heading: 0.05        # 맵 업데이트 최소 회전 각도 (rad)

    # --- 데이터 보정 및 루프 클로저 ---
    use_scan_matching: true             # 스캔 매칭 활성화 (Odometry drift 보정)
    do_loop_closing: true               # 루프 클로저 활성화 (이전 경로 재방문 시 보정)

# 공식 문서 참고: https://docs.ros.org/en/humble/p/slam_toolbox/